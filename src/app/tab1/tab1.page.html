<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Países</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-searchbar
    placeholder="Buscar país..."
    [debounce]="300"
    (ionInput)="buscar($event)"
  ></ion-searchbar>

  <div *ngIf="cargando" class="centro">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando países...</p>
  </div>

  <div *ngIf="error" class="centro">
    <ion-icon name="cloud-offline-outline" class="icono-error"></ion-icon>
    <p>No se pudieron cargar los países.</p>
    <ion-button (click)="cargarPaises()">Reintentar</ion-button>
  </div>

  <ion-card *ngFor="let pais of paisesFiltrados">
    <img [src]="pais.bandera" [alt]="pais.name.common" />
    <ion-card-header>
      <ion-card-title>{{ pais.name.common }}</ion-card-title>
      <ion-card-subtitle>{{ pais.capital?.[0] || 'Sin capital' }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-chip>{{ pais.region || 'Sin región' }}</ion-chip>
      <ion-chip outline="true">{{ pais.area | number }} km²</ion-chip>
    </ion-card-content>
  </ion-card>
</ion-content>
